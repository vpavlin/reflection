# Flatpak of Reflection with the Logos Delivery backend (branch "logos", next to the Flathub one).
# It syncs over Logos Delivery by default; REFLECTION_BACKEND=p2panda switches back. See
# docs/logos/README.md.
#
#   gh workflow run logos-flatpak.yml --repo vpavlin/reflection --ref feat/logos-delivery
name: Logos Flatpak

on:
  workflow_dispatch:
  push:
    branches: [feat/logos-delivery]
    paths:
      - cx.modal.Reflection.Logos.json
      - .github/workflows/logos-flatpak.yml
      - reflection-app/**
      - reflection-doc/**
      - reflection-node/**

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reflection-logos.flatpak
          manifest-path: cx.modal.Reflection.Logos.json
          branch: logos
          cache-key: flatpak-logos-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          run-tests: false
