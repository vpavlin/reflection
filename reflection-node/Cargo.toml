[package]
name = "reflection-node"
version = "0.5.0"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "Julian Sparber <julian@sparber.net>"
]

[features]
test_utils = []
# Sync over Logos Delivery (docs/logos). Pure Rust: includes the in-memory bus for tests.
logos = ["dep:p2panda-core", "dep:chacha20poly1305", "dep:hex"]
# Adds the liblogosdelivery bus. The library is loaded at runtime: nothing native at build time.
logos-ffi = ["logos", "dep:libloading", "dep:base64", "dep:serde_json"]

[dependencies]
chrono = "0.4.43"
p2panda = "0.7.0"
p2panda-store = "0.7.0"
p2panda-core = { version = "0.7.0", optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
hex = { version = "0.4.3", optional = true }
libloading = { version = "0.8", optional = true }
base64 = { version = "0.22.1", optional = true }
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"], default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "sync"] }
tokio-stream = "0.1.18"
tracing = "0.1"

[dev-dependencies]
test-log = { version = "0.2.19", default-features = false, features = ["trace", "color"] }
